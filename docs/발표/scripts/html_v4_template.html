<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원자재 퀀트 MI 발표 v4</title>
<style>/*@REVEAL_CSS*/</style>
<style>
:root { --g:#1E3A2F; --gold:#C8A24A; --red:#D9582B; --blue:#2F6E8F; --ink:#222; --muted:#6B6B66; --tint:#F3F3EF; --line:#DADAD3; }
html, body { background:#fff; }
.reveal { font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:var(--ink); font-size:17px; }
.reveal .slides { text-align:left; }
.reveal .slides section { padding:0; height:100%; box-sizing:border-box; }
.reveal .slides section.img-slide, .reveal .slides section > section.img-slide { display:flex !important; align-items:center; justify-content:center; background:#fff; }
img.full { max-width:100%; max-height:100vh; width:auto; height:auto; display:block; margin:0 auto; }
.drill-hint { position:absolute; right:22px; bottom:44px; background:var(--g); color:#fff; font-size:13px; padding:5px 12px; border-radius:14px; opacity:.85; }
/* HTML 장 */
.pg { position:relative; height:100vh; max-width:177.8vh; margin:0 auto; padding:2.2vh 3.2vh 0; box-sizing:border-box; display:flex; flex-direction:column; }
.hd { display:flex; align-items:flex-start; gap:14px; border-bottom:2px solid var(--gold); padding-bottom:1.2vh; }
.sec { background:var(--g); color:#fff; font-weight:700; font-size:2.0vh; padding:.5vh 1.1vh; border-radius:4px; margin-top:.4vh; }
.hd h2 { margin:0; font-size:3.6vh; color:var(--g); font-weight:700; letter-spacing:-.02em; text-transform:none; line-height:1.2; font-family:inherit; }
.hd p { margin:.5vh 0 0; font-size:1.9vh; color:var(--muted); }
.bd { flex:1; display:grid; gap:2vh; padding-top:1.6vh; min-height:0; }
.ft { font-size:1.45vh; color:var(--muted); border-top:1px solid var(--line); padding:.8vh 0 4.2vh; }
.chart { width:100%; height:100%; min-height:0; }
.panel { background:var(--tint); border-radius:8px; padding:1.6vh 1.8vh; font-size:1.85vh; line-height:1.55; }
.panel h3 { margin:0 0 .8vh; font-size:2.2vh; color:var(--g); font-family:inherit; text-transform:none; }
.panel ul { margin:.3vh 0 0 2.2vh; padding:0; } .panel li { margin:.35vh 0; }
.card { border-radius:8px; padding:1.4vh 1.8vh; background:var(--tint); border-top:.6vh solid var(--blue); font-size:1.85vh; line-height:1.55; }
.card h3 { margin:0 0 .6vh; font-size:2.2vh; font-family:inherit; text-transform:none; }
.btns { display:flex; gap:.8vh; margin-bottom:.8vh; flex-wrap:wrap; }
.btns button { font-family:inherit; font-size:1.8vh; padding:.6vh 1.4vh; border:1px solid var(--g); background:#fff; color:var(--g); border-radius:16px; cursor:pointer; }
.btns button.on { background:var(--g); color:#fff; }
.yr { display:flex; align-items:center; gap:1.2vh; font-size:1.9vh; margin-top:.6vh; }
.yr input { flex:1; accent-color:var(--g); }
.yr b { font-size:3vh; color:var(--g); min-width:7vh; }
.big { font-size:4.4vh; font-weight:700; color:var(--g); line-height:1.1; }
.dot { display:inline-block; width:2vh; height:2vh; border-radius:50%; vertical-align:-.25vh; margin-right:.6vh; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:.4vh 1.4vh; margin-top:1vh; }
.kv span:nth-child(odd) { color:var(--muted); }
.hint { font-size:1.5vh; color:var(--muted); }
#stamp { position:fixed; left:14px; bottom:8px; z-index:30; font:12px "Malgun Gothic",sans-serif; color:var(--muted); background:rgba(255,255,255,.85); padding:2px 8px; border-radius:10px; }
#stamp.stale { color:#fff; background:var(--red); font-weight:700; }
.reveal .slide-number { font-family:"Malgun Gothic",sans-serif; background:transparent; color:var(--muted); font-size:12px; }
.reveal .controls { color:var(--g); }
.reveal .progress { color:var(--gold); }
@media print { #stamp { display:none; } }
</style>
</head>
<body>
<div class="reveal"><div class="slides">
<!--@SLIDES-->
</div></div>
<div id="stamp"></div>
<script>/*@REVEAL_JS*/</script>
<script>/*@NOTES_JS*/</script>
<script>/*@PLOTLY_JS*/</script>
<script>
/*@DATA*/
/*@APP_JS*/
</script>
</body>
</html>
