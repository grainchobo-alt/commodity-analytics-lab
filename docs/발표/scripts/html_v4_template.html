<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원자재 퀀트 MI 발표 v4</title>
<style>/*@REVEAL_CSS*/</style>
<style>
:root { --u: 96px; --g:#1E3A2F; --gold:#C8A24A; --red:#D9582B; --blue:#2F6E8F; --ink:#222; --muted:#6B6B66; }
html, body { background:#fff; }
.reveal { font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:var(--ink); }
.reveal .slides { text-align:left; }
.reveal .slides section { padding:0; height:100%; width:100%; box-sizing:border-box; }
/* 장 캔버스: 13.333 × 7.5인치를 화면에 맞춤 (확대·축소 변환 없이 단위만 바꿔 Plotly 마우스 위치가 정확) */
.cv { position:relative; width:calc(var(--u)*13.333); height:calc(var(--u)*7.5); margin:0 auto; top:calc((100vh - var(--u)*7.5)/2); background:#fff; overflow:hidden; }
.cv.dark { background:var(--g); }
.el { position:absolute; box-sizing:border-box; }
.tx { display:flex; flex-direction:column; line-height:1.22; white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; }
.tx p { width:100%; }
.im img { width:100%; height:100%; object-fit:contain; display:block; }
.vd video { width:100%; height:100%; object-fit:contain; background:#000; border-radius:calc(var(--u)*0.05); display:block; }
.tb table td { line-height:1.25; }
.pl { background:#fff; border-radius:calc(var(--u)*0.04); }
.pl .plot { position:absolute; inset:0; }
/* 등장 효과: 장이 보이면 요소가 만든 순서대로 차례로 들어옴. 스크립트가 준비된 뒤(html.anim)에만 숨겼다가 등장 → 스크립트가 막혀도 내용은 보임 */
.anim .reveal .slides section .el { opacity:0; }
.anim .reveal .slides section.present .el { animation:var(--an) .62s cubic-bezier(.2,.75,.25,1) both; animation-delay:calc(var(--i) * 55ms + 120ms); }
.a-up   { --an:aUp; }   .a-left { --an:aLeft; }  .a-zoom { --an:aZoom; }  .a-fade { --an:aFade; }  .a-draw { --an:aDraw; }
@keyframes aUp   { from { opacity:0; transform:translateY(calc(var(--u)*0.22)); } to { opacity:1; transform:none; } }
@keyframes aLeft { from { opacity:0; transform:translateX(calc(var(--u)*-0.45)); } to { opacity:1; transform:none; } }
@keyframes aZoom { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:none; } }
@keyframes aFade { from { opacity:0; transform:scale(.98); } to { opacity:1; transform:none; } }
@keyframes aDraw { from { opacity:0; clip-path:inset(0 100% 0 0); } to { opacity:1; clip-path:inset(0 0 0 0); } }
/* 5장 히트맵 */
.hx { display:flex; flex-direction:column; gap:calc(var(--u)*0.08); background:#fff; }
.hx-g { flex:1; display:grid; gap:calc(var(--u)*0.035); }
.hx-c { display:flex; align-items:center; justify-content:center; border-radius:calc(var(--u)*0.05); font-size:calc(var(--u)*0.135); font-weight:700; }
.hx-h { color:var(--muted); font-weight:400; font-size:calc(var(--u)*0.12); }
.hx-h.hx-last { color:#9A7A1A; font-weight:700; }
.hx-r { justify-content:flex-end; padding-right:calc(var(--u)*0.08); color:var(--ink); font-weight:700; font-size:calc(var(--u)*0.14); }
.hx-r.hx-ts { color:var(--blue); }
.hx-v { cursor:default; transition:transform .15s, box-shadow .15s; }
.hx-v:hover { transform:scale(1.18); box-shadow:0 2px 10px rgba(0,0,0,.25); z-index:3; position:relative; }
.hx-tsv { box-shadow:inset 0 0 0 calc(var(--u)*0.025) var(--blue); }
.hx-csv { box-shadow:inset 0 0 0 calc(var(--u)*0.025) var(--gold); }
.hx-tsv.hx-csv { box-shadow:inset 0 0 0 calc(var(--u)*0.03) #6a5a2a; }
.anim .reveal .slides section .hx-v { opacity:0; }
/* 안전장치: 장이 보인 지 3초 뒤(section.done)에는 효과가 멈춰 있어도 무조건 보이게 (절전·백그라운드 탭 등에서 애니메이션이 안 돌 때) */
.anim .reveal .slides section.done .el, .anim .reveal .slides section.done .hx-v { animation:none !important; opacity:1 !important; }
.anim .reveal .slides section.present .hx-v { animation:aPop .45s cubic-bezier(.3,1.4,.5,1) both; animation-delay:calc(var(--k) * 38ms + 500ms); }
@keyframes aPop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:none; } }
.hx-leg { display:flex; align-items:center; gap:calc(var(--u)*0.1); font-size:calc(var(--u)*0.12); color:var(--muted); }
.hx-leg i { display:inline-block; width:calc(var(--u)*1.6); height:calc(var(--u)*0.1); border-radius:4px; background:linear-gradient(90deg,#cd4a32,#f8f7f2,#2e7d52); }
.hx-key { margin-left:calc(var(--u)*0.25); font-weight:700; } .hx-key.ts { color:var(--blue); } .hx-key.cs { color:#9A7A1A; }
/* 2D 선 그래프: 선이 왼쪽→오른쪽으로 그려짐 */
.plot.sweep .scatterlayer, .plot.sweep .barlayer { animation:sweepIn 2.4s cubic-bezier(.35,.1,.25,1) both; }
@keyframes sweepIn { from { clip-path:inset(0 100% 0 0); } to { clip-path:inset(0 0 0 0); } }
/* 3D 회전 상태 안내 (클릭으로 멈춤 ↔ 다시 회전) */
.spin-tip { position:absolute; right:calc(var(--u)*0.06); bottom:calc(var(--u)*0.05); z-index:6; font-size:calc(var(--u)*0.095); color:var(--muted); background:rgba(255,255,255,.85); padding:1px 6px; border-radius:8px; pointer-events:none; }
.pl.paused .spin-tip { color:#fff; background:var(--g); }
/* 15장 컨트롤 */
.ef-pick { position:absolute; left:calc(var(--u)*0.08); top:calc(var(--u)*0.06); z-index:5; font:inherit; font-size:calc(var(--u)*0.13); padding:2px 6px; border:1px solid var(--g); border-radius:6px; color:var(--g); background:#fff; }
.ey-ctl { position:absolute; left:calc(var(--u)*0.08); right:calc(var(--u)*0.08); bottom:calc(var(--u)*0.04); display:flex; align-items:center; gap:calc(var(--u)*0.08); font-size:calc(var(--u)*0.13); z-index:5; }
.ey-ctl input { flex:1; accent-color:var(--g); }
.ey-ctl button { border:none; background:var(--g); color:#fff; border-radius:50%; width:calc(var(--u)*0.26); height:calc(var(--u)*0.26); cursor:pointer; font-size:calc(var(--u)*0.11); }
.ey-lab { color:var(--g); font-size:calc(var(--u)*0.17); min-width:calc(var(--u)*0.45); }
.ey-gap { color:var(--muted); }
/* 여는 중 화면: 스크립트 해석(수 초) 동안 빈 화면 대신 표시, 8초 넘게 남아 있으면 원인 안내 (CSS만으로 동작) */
#boot { position:fixed; inset:0; z-index:50; background:#1E3A2F; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font:20px "Malgun Gothic",sans-serif; }
#boot .bar { width:220px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden; }
#boot .bar i { display:block; width:40%; height:100%; background:#C8A24A; animation:boot 1.1s ease-in-out infinite; }
@keyframes boot { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
#boot .help { max-width:640px; font-size:14px; line-height:1.6; color:#DCE3DE; opacity:0; animation:show .4s 8s forwards; text-align:center; }
@keyframes show { to { opacity:1; } }
#boot.gone { opacity:0; pointer-events:none; transition:opacity .35s; }
#stamp { position:fixed; right:14px; top:6px; z-index:30; font:12px "Malgun Gothic",sans-serif; color:var(--muted); background:rgba(255,255,255,.85); padding:2px 8px; border-radius:10px; }
#stamp.stale { color:#fff; background:var(--red); font-weight:700; }
.reveal .controls { color:var(--gold); }
.reveal .progress { color:var(--gold); height:4px; }
@media (prefers-reduced-motion: reduce) { .reveal .slides section.present .el, .reveal .slides section.present .hx-v { animation:none; opacity:1; } }
</style>
</head>
<body>
<div id="boot"><b>원자재 퀀트 MI 발표</b><div class="bar"><i></i></div><span style="font-size:14px;color:#AFC0B5">여는 중… (보통 3–5초)</span>
  <div class="help">이 화면이 계속되면 브라우저가 스크립트를 막은 경우입니다.<br>
  · 메일·메신저·사내 문서함 <b>미리보기</b>가 아니라, 파일을 저장한 뒤 <b>Chrome 또는 Edge</b>로 직접 여세요 (Internet Explorer·IE 모드는 불가)<br>
  · zip으로 받았다면 <b>압축을 먼저 푼 뒤</b> index.html을 여세요 (zip 안에서 바로 열면 그림·차트 파일을 못 찾음)</div></div>

</div></div>
<div id="stamp"></div>
